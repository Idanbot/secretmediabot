name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/idanbot/secretmediabot

jobs:
  quality:
    name: Go checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        shell: bash
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.go')
          formatted=$(gofmt -l "${files[@]}")
          test -z "$formatted" || {
            echo 'Go files need formatting.'
            gofmt -d "${files[@]}"
            exit 1
          }

      - name: Run vet
        run: go vet ./...

      - name: Run unit and integration-safe tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore

  fuzz:
    name: Fuzz testing smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz command parser
        run: go test -fuzz=^FuzzParse$ -fuzztime=5s ./internal/command

      - name: Fuzz command target parser
        run: go test -fuzz=^FuzzParseTarget$ -fuzztime=5s ./internal/command

      - name: Fuzz callback token parser
        run: go test -fuzz=^FuzzParseCallbackData$ -fuzztime=5s ./internal/token

      - name: Fuzz constant-time comparator
        run: go test -fuzz=^FuzzConstantTimeEqual$ -fuzztime=5s ./internal/httpserver

  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Create local test environment configuration
        shell: bash
        run: |
          cp .env.example .env
          key=$(openssl rand -base64 32)
          sed -i "s|MEDIA_ENCRYPTION_KEY=.*|MEDIA_ENCRYPTION_KEY=$key|" .env
          sed -i "s|TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=123456789:AAFakeTokenForSmokeTestOnly12345|" .env
          sed -i "s|TELEGRAM_BOT_USERNAME=.*|TELEGRAM_BOT_USERNAME=smoketestbot|" .env
          sed -i "s|OWNER_TELEGRAM_IDS=.*|OWNER_TELEGRAM_IDS=999999|" .env

      - name: Start Docker Compose stack with monitoring
        shell: bash
        run: |
          docker compose --profile monitoring up -d --build

      - name: Wait for services to become healthy
        shell: bash
        run: |
          echo "Waiting for PostgreSQL and Bot readiness..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null && \
               curl -sf http://127.0.0.1:8080/readyz > /dev/null && \
               curl -sf http://127.0.0.1:8080/metrics > /dev/null && \
               curl -sf http://127.0.0.1:9090/-/healthy > /dev/null && \
               curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "All services (bot, postgres, prometheus, grafana) healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Services failed to become healthy in time"
          docker compose --profile monitoring ps
          docker compose --profile monitoring logs
          exit 1

      - name: Tear down Docker Compose
        if: always()
        shell: bash
        run: |
          docker compose --profile monitoring down -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://test:testpassword@127.0.0.1:5432/testdb?sslmode=disable
        run: go test -v -race ./internal/repository/...

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-security:
    name: Filesystem security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: 1

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  image:
    name: Build, scan, and publish image
    needs: [quality, fuzz, smoke, lint, integration, dockerfile, secrets, filesystem-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Scan container image before publishing
        id: scan-image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: 1

      - name: Upload image scan results
        if: always() && steps.scan-image.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=commit-
            type=sha,format=short,prefix=commit-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Secret Media Bot
            org.opencontainers.image.description=Private Telegram group and guest-mode secret media bot
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-architecture image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: mode=max
          sbom: true

      - name: Write immutable Compose reference
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf 'BOT_IMAGE_REF=%s@%s\n' "${IMAGE_NAME}" "${{ steps.build.outputs.digest }}" > compose-image.env
          printf 'IMAGE_DIGEST=%s\n' "${{ steps.build.outputs.digest }}" >> compose-image.env

      - name: Upload immutable Compose reference
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: compose-image-${{ github.sha }}
          path: compose-image.env
          if-no-files-found: error