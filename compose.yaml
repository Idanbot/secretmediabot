services:
  bot:
    # CI publishes immutable GHCR references. Set BOT_IMAGE_REF to the digest
    # artifact for deployment; the tag fallback keeps local development simple.
    image: ${BOT_IMAGE_REF:-ghcr.io/idanbot/secretmediabot:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        COMMIT_MESSAGE: ${COMMIT_MESSAGE:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        CI_RUN_NUMBER: ${CI_RUN_NUMBER:-local}
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_HOST:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks:
      - whisper
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # PostgreSQL 18+ uses a version-aware data directory below this mount.
      - postgres_data:/var/lib/postgresql
    networks:
      - whisper
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  backup:
    image: postgres:18.6-alpine3.24
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whisper
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        FILE="/backups/secretmediabot-$$(date +%Y%m%d_%H%M%S).sql.gz"
        echo "Creating backup at $${FILE}..."
        PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" | gzip > "$${FILE}"
        echo "Backup completed successfully."
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
      - observability
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - whisper
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    profiles:
      - monitoring
      - observability
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - whisper
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mock-telegram:
    image: python:3.12-alpine
    profiles:
      - smoke
      - test
    restart: unless-stopped
    networks:
      - whisper
    command:
      - python3
      - -c
      - |
        import http.server, json
        class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.respond()
            def do_POST(self):
                self.respond()
            def respond(self):
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                method = self.path.split('/')[-1].split('?')[0]
                if method == 'getMe':
                    res = {"ok": True, "result": {"id": 123456789, "is_bot": True, "first_name": "SmokeBot", "username": "smoketestbot", "can_join_groups": True, "can_read_all_group_messages": True, "supports_inline_queries": True, "supports_guest_queries": True}}
                elif method == 'getUpdates':
                    res = {"ok": True, "result": []}
                else:
                    res = {"ok": True, "result": True}
                self.wfile.write(json.dumps(res).encode())
            def log_message(self, format, *args):
                pass
        http.server.HTTPServer(('0.0.0.0', 8081), Handler).serve_forever()
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  whisper:
